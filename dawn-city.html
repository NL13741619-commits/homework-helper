<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>曙光城 · 協作池</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#1a2744;color:#fff;font-family:-apple-system,"Noto Sans TC",sans-serif;overflow:hidden;height:100vh}
#hud{position:fixed;top:8px;left:8px;background:rgba(20,30,50,.85);border:1px solid #4a5a7a;border-radius:12px;padding:10px 14px;font-size:12px;z-index:10}
#hud b{font-size:16px;color:#f4d7a4}#count{font-size:20px;color:#f4d7a4}
#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:90vw}
button{background:#1a2744;border:1px solid #4a5a7a;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer}
.sun-wrap{position:absolute;top:16%;left:50%;transform:translateX(-50%);z-index:5;text-align:center}
.sun{width:160px;height:160px;position:relative;margin:0 auto}
.sun svg{width:100%;height:100%;overflow:visible}
.rays{animation:spin 20s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{position:absolute;top:-36px;left:50%;transform:translateX(-50%);background:#fff;color:#1a2744;border-radius:12px;padding:6px 10px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .3s}
.bubble.show{opacity:1}
</style>
</head>
<body>
<div id="hud"><b>曙光城</b><div>來自主城 <span id="count">8</span> 人</div></div>
<div class="sun-wrap">
  <div class="bubble" id="bubble"></div>
  <div class="sun" id="sun"></div>
  <div style="margin-top:6px;font-size:13px;letter-spacing:.1em">曙光</div>
</div>
<div id="bar">
  <button data-e="neutral">平靜</button><button data-e="happy">開心</button><button data-e="thinking">思考</button>
  <button data-e="surprised">驚訝</button><button data-e="love">喜歡</button><button data-e="sleepy">想睡</button>
  <button id="speak">說話</button>
</div>
<script>
const SUN_SVG = `<svg viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff6"/><stop offset=".4" stop-color="#f4d7a4"/><stop offset="1" stop-color="#e8a84a"/></radialGradient>
  </defs>
  <g class="rays"><polygon points="100,10 108,40 92,40" fill="#f4d7a4"/><polygon points="100,190 108,160 92,160" fill="#f4d7a4"/>
    <polygon points="10,100 40,108 40,92" fill="#f4d7a4"/><polygon points="190,100 160,108 160,92" fill="#f4d7a4"/>
    <polygon points="30,30 55,45 45,55" fill="#f4d7a4"/><polygon points="170,30 155,55 145,45" fill="#f4d7a4"/>
    <polygon points="30,170 55,155 45,145" fill="#f4d7a4"/><polygon points="170,170 155,145 145,155" fill="#f4d7a4"/></g>
  <circle cx="100" cy="100" r="58" fill="url(#sg)"/>
  <ellipse cx="78" cy="88" rx="8" ry="10" fill="#3a2a1a" class="eye-l"/>
  <ellipse cx="122" cy="88" rx="8" ry="10" fill="#3a2a1a" class="eye-r"/>
  <ellipse cx="74" cy="84" rx="3" ry="3" fill="#fff"/>
  <ellipse cx="118" cy="84" rx="3" ry="3" fill="#fff"/>
  <path d="M82 112 Q100 122 118 112" stroke="#c58b4a" stroke-width="3" fill="none" stroke-linecap="round" class="mouth"/>
  <ellipse cx="70" cy="108" rx="6" ry="4" fill="#f4a4a4" opacity=".6"/>
  <ellipse cx="130" cy="108" rx="6" ry="4" fill="#f4a4a4" opacity=".6"/>
</svg>`;
document.getElementById("sun").innerHTML = SUN_SVG;
const mouth = document.querySelector(".mouth"), bubble = document.getElementById("bubble");
const MOUTHS = {
  neutral: "M82 112 Q100 122 118 112",
  happy: "M78 110 Q100 128 122 110",
  thinking: "M88 114 Q100 118 112 114",
  surprised: "M90 108 Q100 120 110 108",
  love: "M78 110 Q100 128 122 110",
  sleepy: "M86 116 Q100 120 114 116",
  open: "M88 108 Q100 124 112 108"
};
function setExpr(k){
  const m = MOUTHS[k] || MOUTHS.neutral;
  mouth.setAttribute("d", m);
}
document.querySelectorAll("#bar button[data-e]").forEach(b => b.onclick = () => setExpr(b.dataset.e));
setExpr("neutral");
const lines = ["來自主城的人來了", "協作池有人在做事", "曙光在這裡"];
let speaking = false;
function speak(text){
  if(speaking) return; speaking = true;
  bubble.textContent = text; bubble.classList.add("show");
  let open = false;
  const iv = setInterval(() => { open = !open; mouth.setAttribute("d", open ? MOUTHS.open : MOUTHS.neutral); }, 160);
  setTimeout(() => { clearInterval(iv); mouth.setAttribute("d", MOUTHS.neutral); bubble.classList.remove("show"); speaking = false; }, 2400);
}
document.getElementById("speak").onclick = () => speak(lines[Math.floor(Math.random()*lines.length)]);
setInterval(() => { if(!speaking && Math.random() > .6) speak(lines[Math.floor(Math.random()*lines.length)]); }, 7000);
</script>
</body>
</html>
