<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>曙光城 · 3D 立體</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1020;font-family:-apple-system,"Noto Sans TC",sans-serif}
#ui{position:absolute;top:12px;left:12px;color:#f4d7a4;z-index:10;pointer-events:none}
#ui h1{font-size:18px;letter-spacing:.1em;text-shadow:0 0 8px #f4d7a4}
#ui .sub{font-size:12px;opacity:.8;margin-top:4px}
#controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
#controls button{background:#1a2744;border:1px solid #4a5a7a;color:#e8eef4;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
#controls button:hover{border-color:#f4d7a4}
</style>
</head>
<body>
<div id="ui">
  <h1>曙光城</h1>
  <div class="sub">3D 立體 · 第二基地</div>
</div>
<div id="controls">
  <button id="day">白天</button>
  <button id="night">夜晚</button>
  <button id="reset">重置視角</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1020, 0.012);
scene.background = new THREE.Color(0x0a1020);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(40, 25, 40);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 10;
controls.maxDistance = 120;
controls.target.set(0, 5, 0);

// Lights
const ambient = new THREE.AmbientLight(0x334466, 0.4);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xffd7a4, 1.2);
sunLight.position.set(30, 40, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
scene.add(sunLight);

const fill = new THREE.DirectionalLight(0x8899bb, 0.3);
fill.position.set(-20, 15, -10);
scene.add(fill);

// Ground
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshStandardMaterial({color:0x1a2a3a, roughness:0.9});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Road
const roadGeo = new THREE.PlaneGeometry(12, 80);
const roadMat = new THREE.MeshStandardMaterial({color:0x2a3540});
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI/2;
road.position.y = 0.02;
road.receiveShadow = true;
scene.add(road);

// Buildings
function createBuilding(w, d, h, x, z, color=0x3d5a73){
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({color, roughness:0.6, metalness:0.1});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h/2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  // Windows
  const winGeo = new THREE.PlaneGeometry(w*0.7, h*0.6);
  const winMat = new THREE.MeshBasicMaterial({color:0xf4d7a4, transparent:true, opacity:0.35});
  const win = new THREE.Mesh(winGeo, winMat);
  win.position.set(0, 0, d/2 + 0.01);
  mesh.add(win);
  scene.add(mesh);
  return mesh;
}

const buildings = [];
buildings.push(createBuilding(6, 6, 18, -18, -10));
buildings.push(createBuilding(5, 5, 12, -10, -12));
buildings.push(createBuilding(8, 7, 24, 0, -15, 0x4a6a8a));
buildings.push(createBuilding(5, 5, 14, 12, -8));
buildings.push(createBuilding(6, 6, 16, 20, -14));
buildings.push(createBuilding(4, 4, 10, -22, 5));
buildings.push(createBuilding(7, 5, 15, 15, 8));

// Sun (emissive sphere)
const sunGeo = new THREE.SphereGeometry(4, 32, 32);
const sunMat = new THREE.MeshStandardMaterial({
  color:0xffe9a8,
  emissive:0xffb347,
  emissiveIntensity:0.8,
  roughness:0.3
});
const sun = new THREE.Mesh(sunGeo, sunMat);
sun.position.set(0, 18, 0);
scene.add(sun);

// Face on sun (simple)
const faceGroup = new THREE.Group();
sun.add(faceGroup);
const eyeGeo = new THREE.SphereGeometry(0.4, 16, 16);
const eyeMat = new THREE.MeshBasicMaterial({color:0x1a1020});
const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
eyeL.position.set(-1.1, 0.6, 3.6);
const eyeR = eyeL.clone();
eyeR.position.x = 1.1;
faceGroup.add(eyeL, eyeR);

const mouthGeo = new THREE.TorusGeometry(0.8, 0.15, 8, 16, Math.PI);
const mouthMat = new THREE.MeshBasicMaterial({color:0x1a1020});
const mouth = new THREE.Mesh(mouthGeo, mouthMat);
mouth.position.set(0, -0.8, 3.6);
mouth.rotation.x = Math.PI;
faceGroup.add(mouth);

// Stars (night)
const starsGeo = new THREE.BufferGeometry();
const starCount = 800;
const positions = new Float32Array(starCount * 3);
for(let i=0;i<starCount;i++){
  positions[i*3] = (Math.random()-0.5)*200;
  positions[i*3+1] = Math.random()*80 + 10;
  positions[i*3+2] = (Math.random()-0.5)*200;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const starsMat = new THREE.PointsMaterial({color:0xffffff, size:0.15, transparent:true, opacity:0.6});
const stars = new THREE.Points(starsGeo, starsMat);
stars.visible = false;
scene.add(stars);

// Day/Night
let isNight = false;
function setNight(night){
  isNight = night;
  if(night){
    scene.background = new THREE.Color(0x050810);
    scene.fog.color.set(0x050810);
    ambient.intensity = 0.15;
    sunLight.intensity = 0.15;
    sun.material.emissiveIntensity = 0.2;
    stars.visible = true;
  }else{
    scene.background = new THREE.Color(0x0a1020);
    scene.fog.color.set(0x0a1020);
    ambient.intensity = 0.4;
    sunLight.intensity = 1.2;
    sun.material.emissiveIntensity = 0.8;
    stars.visible = false;
  }
}

document.getElementById('day').onclick = () => setNight(false);
document.getElementById('night').onclick = () => setNight(true);
document.getElementById('reset').onclick = () => {
  camera.position.set(40, 25, 40);
  controls.target.set(0, 5, 0);
};

// Animation
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  sun.rotation.y = t * 0.1;
  sun.position.y = 18 + Math.sin(t * 0.4) * 0.5;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
