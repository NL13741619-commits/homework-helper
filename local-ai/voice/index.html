<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>曙光｜直接說話</title><link rel="stylesheet" href="/style.css"></head><body><main>
<div id="sun" aria-label="曙光">☀️</div><h1>直接跟曙光說話</h1><p>開啟一次麥克風，接著自然對話。</p>
<label>本機存取碼<input id="token" type="password" autocomplete="off"></label>
<div class="controls"><button id="start">開始語音</button><button id="interrupt" disabled>打斷回答</button><button id="stop" disabled>結束</button></div>
<p id="status" role="status" aria-live="polite">尚未連線</p>
<label class="captions"><input id="captions" type="checkbox">顯示輔助字幕（預設關閉）</label><div id="transcript" hidden aria-live="off"></div>
<p class="note">本地實驗版：Whisper 聽語音、Qwen 接話、Kokoro 中文聲音。字幕不是聲音來源。需要模型主機持續運作；瀏覽器收音與回音抑制仍待實機驗收。</p>
</main><script src="/client.js"></script></body></html>
