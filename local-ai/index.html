<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曙光自主 AI 實驗室</title><link rel="stylesheet" href="/style.css"></head><body><main>
<header><span id="sun" aria-label="曙光小太陽">☀️</span><div><h1>曙光自主 AI</h1><p>本地聊天 · 本地語音 · 樂譜歌唱原型</p></div></header>
<div id="status" role="status" aria-live="polite">檢查本地主機…</div>
<details><summary>連線與能力</summary><label>本機存取碼<input id="token" type="password" autocomplete="off" placeholder="從本機私人 token 檔貼上，不傳給第三方"></label><p>聊天模型：Qwen3-0.6B Q8。本版語音與歌唱使用英文合成聲；中文聲線與語音辨識尚未接入。歌唱是音符控制的 DSP 實驗，並非自訓練歌唱模型。</p><button id="health">重新檢查</button></details>
<section><h2>跟曙光聊天</h2><div id="chat" aria-live="polite"></div><form id="chatForm"><textarea id="message" required maxlength="4000" rows="3" placeholder="可以用繁體中文聊天…"></textarea><button>傳送</button></form><button id="readReply" disabled>朗讀英文回覆</button></section>
<section><h2>讓曙光唱歌</h2><p>原創四小節：Dawn shines bright now / We sing with joy / A new day comes / We share our light</p><label>聲線<select id="voice"><option value="flite-slt-en">Dawn Local SLT · 英文 · 實驗聲線</option></select></label><label>速度 <input id="tempo" type="range" min="70" max="140" value="100"><output id="tempoLabel">100 BPM</output></label><button id="sing">唱四小節原創曲</button><button id="stop" disabled>停止／取消</button><p id="subtitle" aria-live="polite"></p><audio id="audio" controls></audio><div id="downloads"></div><p class="small">輸出包括人聲、伴奏、混音、MIDI 與歌詞時間軸；音高和節拍可檢驗。這個實驗不模仿指定歌手。</p></section>
</main><script src="/client.js"></script></body></html>
