<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>曙光沙盒 · 圖生影片</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#1a2744;color:#fff;font-family:-apple-system,"Noto Sans TC",sans-serif;min-height:100vh;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
a{color:#f4d7a4;text-decoration:none}
.sun{width:48px;height:48px}
.card{background:rgba(20,30,50,.85);border:1px solid #4a5a7a;border-radius:16px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:#b8a48a;margin:8px 0 4px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #4a5a7a;background:#120e0a;color:#fff;font:inherit}
textarea{min-height:80px}
button{background:linear-gradient(135deg,#ffe9a8,#ffb347);color:#1a1008;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:8px}
button:disabled{opacity:.5}
img,video{max-width:100%;border-radius:12px;margin-top:8px;background:#000}
#status{font-size:13px;min-height:18px;margin:8px 0;color:#ffb4b4}
#status.ok{color:#86efac}
.note{font-size:12px;color:#b8a48a;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="sun" id="sun"></div>
  <div><b>曙光沙盒</b><div style="font-size:12px;color:#b8a48a">圖片 → 5 秒影片</div></div>
  <div style="flex:1"></div>
  <a href="dawn-city.html">回城市</a>
</header>
<div class="card">
  <label>上傳圖片</label>
  <input id="file" type="file" accept="image/*">
  <img id="preview" alt="">
  <label>提示詞</label>
  <textarea id="prompt">夜晚街道，一個人站在雨中，鏡頭緩慢靠近。</textarea>
  <button id="run">生成 5 秒影片</button>
  <div id="status"></div>
  <video id="out" controls style="display:none"></video>
  <div class="note">免費端點需要 API 金鑰。目前主城用 Magic Hour，第二基地尚未配置金鑰。提供金鑰後可接通。</div>
</div>
<script>
const SUN_SVG = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="28" fill="#f4d7a4"/><ellipse cx="38" cy="44" rx="4" ry="5" fill="#3a2a1a"/><ellipse cx="62" cy="44" rx="4" ry="5" fill="#3a2a1a"/><path d="M40 58 Q50 64 60 58" stroke="#c58b4a" stroke-width="2" fill="none"/></svg>`;
document.getElementById("sun").innerHTML = SUN_SVG;
const file = document.getElementById("file"), preview = document.getElementById("preview"), status = document.getElementById("status"), out = document.getElementById("out");
let imgData = null;
file.onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { imgData = r.result; preview.src = imgData; };
  r.readAsDataURL(f);
};
document.getElementById("run").onclick = async () => {
  if(!imgData){ status.textContent = "請先上傳圖片"; return; }
  status.textContent = "準備中…"; status.className = "";
  // 免費端點需要金鑰。這裡顯示狀態。
  status.textContent = "尚未配置免費圖生影片端點金鑰。請提供端點或金鑰後接通。";
  status.className = "";
};
</script>
</body>
</html>
