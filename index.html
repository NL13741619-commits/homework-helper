<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <title>AIVAULT</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17213c 0,#080b14 48%,#05070d 100%);color:#f5f7ff}.wrap{max-width:980px;margin:auto;padding:72px 22px}.brand{font-size:clamp(44px,9vw,86px);letter-spacing:.12em;margin:0}.tag{color:#aeb8d6;font-size:18px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:38px}.card{border:1px solid #29334e;background:#101625cc;border-radius:20px;padding:22px;min-height:150px}.card h2{margin-top:0}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#17223d;color:#c8d6ff;font-size:13px}.notice{margin-top:28px;padding:16px 18px;border-left:3px solid #6d86d8;background:#0d1322;color:#b8c2df;line-height:1.65}
  </style>
</head>
<body>
<main class="wrap">
  <span class="status">SECOND BASE · REBUILD</span>
  <h1 class="brand">AIVAULT</h1>
  <p class="tag">自主 AI 工程基地。任務接收、隔離施工、測試驗證、Draft PR 與稽核證據將集中於此。</p>
  <section class="grid">
    <article class="card"><h2>Command</h2><p>接收結構化工程命令，拒絕未授權與重放請求。</p></article>
    <article class="card"><h2>Agent</h2><p>在隔離分支與工作區執行，禁止自主直寫 main。</p></article>
    <article class="card"><h2>Evidence</h2><p>保留測試、commit、PR 與模型使用紀錄。</p></article>
  </section>
  <div class="notice">安全邊界：AIVAULT 不得修改 safe-reunion-login、safe-reunion 或正式安全團聚 Supabase 專案。</div>
</main>
</body>
</html>
