<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>曙光城 · AIVAULT</title>
<style>
:root{
  --bg:#0c0a08;--panel:#1a1410;--line:#3a2e24;--text:#f5efe6;--muted:#b8a48a;
  --sun:#ffb347;--glow:#ffe9a8;--accent:#ffd27a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
body{background:radial-gradient(ellipse at top,#2a1f14 0%,var(--bg) 55%)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,10,8,.92);z-index:5}
.logo{font-weight:800;letter-spacing:.18em;font-size:14px;background:linear-gradient(90deg,var(--glow),var(--sun));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grow{flex:1}
.nav a{color:var(--accent);text-decoration:none;font-size:13px;margin-left:12px}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px}
.sun{
  width:88px;height:88px;margin:0 auto 18px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0%,#ffe9a8 28%,#ffb347 62%,transparent 72%);
  box-shadow:0 0 48px #ffb347,0 0 90px rgba(255,179,71,.35);
  animation:pulse 3.2s ease-in-out infinite alternate;
}
@keyframes pulse{from{transform:scale(.96);opacity:.9}to{transform:scale(1.04);opacity:1}}
h1{text-align:center;margin:0 0 6px;font-size:28px;letter-spacing:1px}
.sub{text-align:center;color:var(--muted);margin-bottom:28px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=email],input[type=password]{
  width:100%;height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:#120e0a;color:var(--text);font:inherit
}
.remember{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px;color:var(--muted);cursor:pointer}
.remember input{width:16px;height:16px;accent-color:var(--sun)}
button{
  width:100%;height:48px;margin-top:8px;border:0;border-radius:12px;
  background:linear-gradient(135deg,#ffe9a8,#ffb347);color:#1a1008;font-weight:700;font-size:15px;cursor:pointer
}
button.secondary{background:transparent;border:1px solid var(--line);color:var(--accent);margin-top:10px}
.msg{font-size:13px;min-height:18px;margin:8px 0;color:#ffb4b4}
.ok{color:#86efac}
#ai{display:none;margin-top:16px}
#ai .who{font-size:13px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="logo">AIVAULT</div>
  <div class="grow"></div>
  <nav class="nav"><a href="dawn.html">曙光頁面</a></nav>
</header>
<div class="wrap">
  <div class="sun"></div>
  <h1>曙光城</h1>
  <div class="sub">AIVAULT 第二基地 · 曙光控管</div>
  <div class="card" id="auth">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="name@example.com">
    <label for="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password">
    <label class="remember"><input id="remember" type="checkbox"> 記住帳號密碼</label>
    <div class="msg" id="msg"></div>
    <button id="go"><strong>登入</strong></button>
    <button class="secondary" id="switch">沒有帳號？立即註冊</button>
  </div>
  <div class="card" id="ai">
    <div class="who" id="who"></div>
    <p style="text-align:center;margin:12px 0">已進入曙光城</p>
    <a href="dawn.html" style="display:block;text-align:center;color:var(--accent);text-decoration:none;font-weight:700">前往曙光頁面 →</a>
    <button class="secondary" id="out" style="margin-top:16px">登出</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://svtkpdmqemidlasowqew.supabase.co'
const SUPABASE_ANON='sb_publishable_ijiUkIvCMv-44aDAWx0t3A_iX1Viscf'
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON)
const auth=document.getElementById('auth'),ai=document.getElementById('ai'),msg=document.getElementById('msg')
const emailEl=document.getElementById('email'),passEl=document.getElementById('password'),remEl=document.getElementById('remember')
let mode='login'
function showAuth(){auth.style.display='block';ai.style.display='none'}
function showAI(email){auth.style.display='none';ai.style.display='block';document.getElementById('who').textContent='已登入：'+email}
function setMode(m){
  mode=m
  const reg=mode==='register'
  document.getElementById('go').innerHTML=reg?'<strong>註冊</strong>':'<strong>登入</strong>'
  document.getElementById('switch').textContent=reg?'已有帳號？返回登入':'沒有帳號？立即註冊'
  msg.textContent=''
}
async function boot(){
  const saved=localStorage.getItem('dawn_remember_email')
  if(saved){emailEl.value=saved;remEl.checked=true}
  const {data:{session}}=await supabase.auth.getSession()
  if(session?.user)showAI(session.user.email);else showAuth()
}
boot()
document.getElementById('switch').onclick=()=>setMode(mode==='login'?'register':'login')
document.getElementById('go').onclick=async()=>{
  msg.textContent=mode==='register'?'註冊中…':'登入中…';msg.className='msg'
  const email=emailEl.value.trim(),password=passEl.value
  if(!email||!password){msg.textContent='請輸入 Email 與密碼';return}
  if(remEl.checked)localStorage.setItem('dawn_remember_email',email);else localStorage.removeItem('dawn_remember_email')
  if(mode==='register'){
    if(password.length<6){msg.textContent='密碼至少 6 字';return}
    const {data,error}=await supabase.auth.signUp({email,password})
    if(error){msg.textContent=error.message||'註冊失敗';return}
    if(data.session){showAI(data.user.email);return}
    msg.textContent='註冊成功，請至信箱驗證後再登入。';msg.className='msg ok'
    setMode('login');return
  }
  const {data,error}=await supabase.auth.signInWithPassword({email,password})
  if(error){msg.textContent=error.message||'登入失敗';return}
  showAI(data.user.email)
}
document.getElementById('out').onclick=async()=>{await supabase.auth.signOut();showAuth()}
</script>
</body>
</html>
