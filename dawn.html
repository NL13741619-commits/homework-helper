<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<title>AIVAULT｜曙光</title>
<style>
:root{
  --bg:#f7f4ef;--panel:#fff;--line:#e8e0d6;--text:#1a140e;--muted:#8a7a68;
  --sun:#ffb347;--glow:#ffe9a8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;min-height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.tab{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted)}
.tab.active{background:#fff8e8;border-color:var(--sun);color:#a06a20}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff}
.avatar{width:28px;height:28px;border-radius:50%;background:#222;display:grid;place-items:center;font-size:14px}
.title{font-weight:700;font-size:14px;flex:1}
.back{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:4px 8px;border-radius:12px}
.chat{padding:12px;min-height:40vh;max-height:50vh;overflow:auto}
.msg{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.bubble{max-width:70%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4}
.msg.user .bubble{background:#e8e0d6;color:var(--text)}
.msg.ai .bubble{background:#fff;border:1px solid var(--line)}
.sun-ico{font-size:20px}
.panel{
  position:fixed;right:12px;bottom:90px;width:200px;background:#fff;border:1px solid var(--line);
  border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:10px;z-index:10
}
.panel h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#86efac}
.stage{
  height:100px;background:linear-gradient(180deg,#fff8e8,#fff);border-radius:12px;
  display:grid;place-items:center;margin-bottom:8px
}
.sun{
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0%,#ffe9a8 30%,#ffb347 70%);
  box-shadow:0 0 20px #ffb347;
  animation:pulse 2.5s ease-in-out infinite alternate;
  position:relative
}
.sun:before{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(255,179,71,.4),transparent);
  animation:spin 6s linear infinite
}
@keyframes pulse{from{transform:scale(.95)}to{transform:scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid button{height:32px;font-size:11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.input-bar{
  position:fixed;bottom:0;left:0;right:0;padding:10px 12px;background:#fff;border-top:1px solid var(--line);
  display:flex;gap:8px;align-items:center
}
.input-bar input{flex:1;height:40px;border:1px solid var(--line);border-radius:20px;padding:0 14px;font:inherit}
.input-bar button{height:40px;padding:0 16px;border-radius:20px;border:0;background:#1a140e;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="tabs">
  <div class="tab active">🤝 AI 協作池</div>
  <div class="tab">⚡ 算力池</div>
</div>
<div class="bar">
  <div class="avatar">🌑</div>
  <div class="title">曙光</div>
  <span class="sun-ico">🌞</span>
  <a class="back" href="index.html">← 返回</a>
</div>
<div class="chat" id="chat"></div>
<div class="panel">
  <h4>🌞 曙光數字人 <span class="dot"></span> 已連結</h4>
  <div class="stage"><div class="sun"></div></div>
  <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px">👂 曙光正在聆聽</div>
  <div class="grid">
    <button id="link">🔗 連結即時暗星</button>
    <button id="expr">▶ 表情測試</button>
    <button id="together">🌙🌞 一起聊</button>
    <button id="chatbtn">🌙🌞 互聊</button>
  </div>
</div>
<div class="input-bar">
  <input id="q" placeholder="傳訊息給曙光">
  <button id="send">送出</button>
</div>
<script>
const chat=document.getElementById('chat'),q=document.getElementById('q')
function add(role,text){
  const m=document.createElement('div')
  m.className='msg '+(role==='user'?'user':'ai')
  m.innerHTML='<span class="sun-ico">'+(role==='user'?'':'\ud83c\udf1e')+'</span><div class="bubble">'+text+'</div>'
  chat.appendChild(m)
  chat.scrollTop=chat.scrollHeight
}
document.getElementById('send').onclick=()=>{
  const t=q.value.trim()
  if(!t)return
  add('user',t)
  q.value=''
  setTimeout(()=>add('ai','曙光已收到。'),300)
}
document.getElementById('link').onclick=()=>add('ai','連結即時暗星（骨架）')
document.getElementById('expr').onclick=()=>add('ai','表情測試（骨架）')
document.getElementById('together').onclick=()=>add('ai','一起聊（骨架）')
document.getElementById('chatbtn').onclick=()=>add('ai','互聊（骨架）')
</script>
</body>
</html>
