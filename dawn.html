<!DOCTYPE html>
<html lang="zh-Hant">
<head><script>document.documentElement.style.visibility="hidden"</script><script src="shared-auth-config.js"></script><script src="shared-auth.js"></script><noscript>請啟用 JavaScript 並登入。</noscript>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<title>AIVAULT｜曙光</title>
<style>
:root{
  --bg:#f7f4ef;--panel:#fff;--line:#e8e0d6;--text:#1a140e;--muted:#8a7a68;
  --sun:#ffb347;--glow:#ffe9a8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;min-height:100dvh}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ffe9a8,#ffb347);display:grid;place-items:center;font-size:18px}
.title{font-weight:700;font-size:15px;flex:1}
.back{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:4px 8px;border-radius:12px}
.chat{padding:12px;min-height:40vh;max-height:calc(100dvh - 220px);overflow:auto}
.msg{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.msg.user .bubble{background:#e8e0d6;color:var(--text)}
.msg.ai .bubble{background:#fff;border:1px solid var(--line)}
.sun-ico{font-size:22px;flex-shrink:0}
.panel{
  position:fixed;right:12px;bottom:80px;width:180px;background:#fff;border:1px solid var(--line);
  border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:10px;z-index:10
}
.panel h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#86efac}
.stage{
  height:90px;background:linear-gradient(180deg,#fff8e8,#fff);border-radius:12px;
  display:grid;place-items:center;margin-bottom:6px
}
.sun{
  width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0%,#ffe9a8 30%,#ffb347 70%);
  box-shadow:0 0 16px #ffb347;
  position:relative;
}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;line-height:1}
.eyes{letter-spacing:2px}
.mouth{font-size:14px;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid button{height:30px;font-size:11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.input-bar{
  position:fixed;bottom:0;left:0;right:0;padding:10px 12px;background:#fff;border-top:1px solid var(--line);
  display:flex;gap:8px;align-items:center
}
.input-bar input{flex:1;height:40px;border:1px solid var(--line);border-radius:20px;padding:0 14px;font:inherit}
.input-bar button{height:40px;padding:0 16px;border-radius:20px;border:0;background:#1a140e;color:#fff;font-weight:700;cursor:pointer}
.status{font-size:12px;color:var(--muted);text-align:center;margin:4px 0}
</style>
</head>
<body>
<div class="bar">
  <div class="avatar">🌞</div>
  <div class="title">曙光</div>
  <a class="back" href="index.html">← 返回</a>
</div>
<div class="chat" id="chat"></div>
<div class="panel">
  <h4>🌞 曙光 <span class="dot"></span> 任務模式</h4>
  <div class="stage"><div class="sun" id="sun"><div class="face"><div class="eyes">● ●</div><div class="mouth">◐</div></div></div></div>
  <div class="status" id="status">Qwen CPU 已通過實際問答</div>
  <div class="grid">
    <button data-e="neutral">平靜</button>
    <button data-e="happy">開心</button>
    <button data-e="sad">難過</button>
    <button data-e="think">思考</button>
  </div>
</div>
<div class="input-bar">
  <input id="q" placeholder="輸入問題，前往 GitHub 送出公開任務">
  <button id="send">建立任務</button>
</div>
<script>
const FACES = {
  neutral: {e: '● ●', m: '◐'},
  happy: {e: '^ ^', m: '◕'},
  sad: {e: '› ‹', m: '◔'},
  think: {e: '● ◐', m: '—'}
};
const sun = document.getElementById('sun');
const eyes = sun.querySelector('.eyes');
const mouth = sun.querySelector('.mouth');
const status = document.getElementById('status');
function setExpr(k){
  const f = FACES[k] || FACES.neutral;
  eyes.textContent = f.e;
  mouth.textContent = f.m;
}
document.querySelectorAll('.grid button').forEach(b => b.onclick = () => setExpr(b.dataset.e));
setExpr('neutral');

const chat = document.getElementById('chat');
const q = document.getElementById('q');
function add(role, text){
  const m = document.createElement('div');
  m.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  const icon = document.createElement('span'); icon.className = 'sun-ico'; icon.textContent = role === 'user' ? '' : '🌞';
  const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
  m.append(icon, bubble);
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m;
}
function ask(text){
  if(text.length > 4000){ add('ai', '問題最多 4,000 個字。'); return; }
  const url = new URL('https://github.com/NL13741619-commits/homework-helper/issues/new');
  url.searchParams.set('title', '曙光 AI 任務');
  url.searchParams.set('body', '/dawn ' + text);
  const message = add('ai', '模型已部署在第二基地。請點下方連結，在 GitHub 確認送出公開任務；曙光會啟動 Qwen 並在該任務回覆。這裡尚未接上即時聊天。\n');
  const link = document.createElement('a');
  link.href = url.href;
  link.textContent = '前往 GitHub 送出給曙光';
  message.querySelector('.bubble').append(link);
  status.textContent = '等待你在 GitHub 送出';
  setExpr('neutral');
}
document.getElementById('send').onclick = () => {
  const t = q.value.trim();
  if(!t) return;
  add('user', t);
  q.value = '';
  ask(t);
};
q.addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('send').click(); });
</script>
</body>
</html>
