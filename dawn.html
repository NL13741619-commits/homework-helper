<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>AIVAULT｜曙光頁面</title>
<style>
:root{
  --bg:#0c0a08;--panel:#1a1410;--line:#3a2e24;--text:#f5efe6;--muted:#b8a48a;
  --sun:#ffb347;--glow:#ffe9a8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;min-height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,10,8,.94);z-index:5}
.logo{font-weight:800;letter-spacing:.16em;font-size:13px;background:linear-gradient(90deg,var(--glow),var(--sun));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grow{flex:1}
.nav a{color:var(--glow);text-decoration:none;font-size:12px;margin-left:10px}
.wrap{max-width:980px;margin:0 auto;padding:14px;display:grid;gap:12px}
@media(min-width:880px){.wrap{grid-template-columns:1.1fr .9fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.stage{
  width:100%;aspect-ratio:4/5;border-radius:14px;background:#120e0a;
  display:grid;place-items:center;position:relative;overflow:hidden;
}
.sun{
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0%,#ffe9a8 30%,#ffb347 65%,transparent 75%);
  box-shadow:0 0 50px #ffb347,0 0 100px rgba(255,179,71,.4);
  animation:rise 4s ease-in-out infinite alternate;
}
@keyframes rise{from{transform:translateY(8px) scale(.95)}to{transform:translateY(-6px) scale(1.05)}}
.caps{min-height:120px;max-height:280px;overflow:auto;font-size:13px;line-height:1.55;margin-top:10px}
.cap{margin:0 0 8px;padding:8px 10px;border-radius:10px}
.cap.user{background:#2a2018}
.cap.ai{background:#1f1812}
textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:10px;background:#120e0a;color:var(--text);padding:9px 10px;font:inherit;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px}
button{
  height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);
  background:#241c16;color:var(--text);font-size:13px;font-weight:700;cursor:pointer
}
button.primary{background:linear-gradient(135deg,#ffe9a8,#ffb347);color:#1a1008;border:0}
.status{font-size:12px;color:var(--muted);padding:8px 10px;border-radius:10px;background:#120e0a;margin-top:8px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div class="logo">AIVAULT</div>
  <div class="grow"></div>
  <nav class="nav"><a href="index.html">曙光城</a></nav>
</header>
<div class="wrap">
  <div class="card">
    <div class="stage" aria-label="曙光數字人">
      <div class="sun"></div>
    </div>
    <div class="status" id="status">曙光就緒</div>
  </div>
  <div class="card">
    <div class="caps" id="caps"></div>
    <textarea id="q" placeholder="對曙光說…"></textarea>
    <div class="row">
      <button class="primary" id="send">送出</button>
      <button id="clear">清除</button>
    </div>
  </div>
</div>
<script>
const caps=document.getElementById('caps'),q=document.getElementById('q'),status=document.getElementById('status')
function cap(role,text){
  const d=document.createElement('div')
  d.className='cap '+(role==='user'?'user':'ai')
  d.textContent=text
  caps.appendChild(d)
  caps.scrollTop=caps.scrollHeight
}
document.getElementById('send').onclick=()=>{
  const t=q.value.trim()
  if(!t)return
  cap('user',t)
  q.value=''
  status.textContent='曙光處理中…'
  setTimeout(()=>{
    cap('ai','曙光已收到。後端尚未完全開通，此為對話框骨架。')
    status.textContent='曙光就緒'
  },400)
}
document.getElementById('clear').onclick=()=>{caps.innerHTML='';status.textContent='曙光就緒'}
</script>
</body>
</html>
